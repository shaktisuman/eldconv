# Nightly validation against a real ld.eld, on the Linux kernel.
#
# build-eld  builds eld `main` into llvm-project `main` with clang, the way eld's README describes
#            ("Building ELD and running tests"), and saves ld.eld as an artifact.
# kernel     takes that ld.eld, converts a Linux kernel tree to link with it using eldconv, checks
#            that every link went through eld, and boots the resulting arm64 kernel under qemu.
#
# arm64 because an x86 kernel's final vmlinux link still stops in eld (docs/USAGE.md).
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      eld_ref:
        description: qualcomm/eld branch, tag or commit
        default: main
      llvm_ref:
        description: llvm/llvm-project branch, tag or commit
        default: main
      kernel_ref:
        description: torvalds/linux tag, branch or commit
        default: v6.12

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # -eo pipefail

env:
  ELD_REF: ${{ inputs.eld_ref || 'main' }}
  LLVM_REF: ${{ inputs.llvm_ref || 'main' }}
  KERNEL_REF: ${{ inputs.kernel_ref || 'v6.12' }}
  # the host compiler; raise it when llvm-project main stops building with it
  CLANG_VERSION: "18"

jobs:
  build-eld:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - uses: actions/checkout@v5   # for hashFiles below; llvm-project and eld go into subdirectories

      - name: Resolve refs to commits
        id: refs
        run: |
          resolve() {  # repo ref -> commit sha (a peeled annotated tag wins over the tag object)
            if [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then echo "$2"; return; fi
            git ls-remote "https://github.com/$1" "refs/heads/$2" "refs/tags/$2*" |
              awk -v h="refs/heads/$2" -v t="refs/tags/$2" \
                '$2 == t "^{}" {p=$1} $2 == h || $2 == t {r=$1} END {print p ? p : r}'
          }
          eld=$(resolve qualcomm/eld "$ELD_REF")
          llvm=$(resolve llvm/llvm-project "$LLVM_REF")
          test -n "$eld" && test -n "$llvm" || { echo "::error::cannot resolve eld=$ELD_REF llvm=$LLVM_REF"; exit 1; }
          echo "eld=$eld" >> "$GITHUB_OUTPUT"
          echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
          echo "eld \`$eld\` on llvm-project \`$llvm\`, built with clang-$CLANG_VERSION" >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse an ld.eld built from the same commits
        id: dist
        uses: actions/cache@v4
        with:
          path: eld-dist
          # the workflow is in the key: new compiler or CMake options must not reuse an old binary
          key: ld.eld-${{ steps.refs.outputs.eld }}-${{ steps.refs.outputs.llvm }}-${{ hashFiles('.github/workflows/nightly.yml') }}

      - name: Free disk space
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install clang and build dependencies
        run: |
          sudo apt-get update
          # libc++ is both what the build links against and what the resulting ld.eld needs at run time
          sudo apt-get install -y --no-install-recommends \
            "clang-$CLANG_VERSION" "lld-$CLANG_VERSION" "libc++-$CLANG_VERSION-dev" "libc++abi-$CLANG_VERSION-dev" \
            cmake ninja-build ccache python3 build-essential patchelf
          # Debian names the tools clang-N / ld.lld-N; plain clang and ld.lld live here
          echo "/usr/lib/llvm-$CLANG_VERSION/bin" >> "$GITHUB_PATH"

      - name: Checkout llvm-project
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: llvm/llvm-project
          ref: ${{ steps.refs.outputs.llvm }}
          path: llvm-project
          fetch-depth: 1

      - name: Checkout eld
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: qualcomm/eld
          ref: ${{ steps.refs.outputs.eld }}
          path: llvm-project/eld
          fetch-depth: 1

      - name: Restore ccache
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/cache/restore@v4
        with:
          path: .ccache
          # the key never matches (it carries the run id); the prefix restores the newest cache
          key: ccache-clang${{ env.CLANG_VERSION }}-${{ github.run_id }}
          restore-keys: ccache-clang${{ env.CLANG_VERSION }}-

      - name: Configure
        if: steps.dist.outputs.cache-hit != 'true'
        # eld's README: eld as an LLVM external project, libc++, one target list for every arch eld links.
        # Release and no assertions instead of the README's Debug build, to fit the runner;
        # symbol versioning on, as docs/USAGE.md recommends (the kernel's vDSO needs it).
        run: |
          ccache --max-size=3G
          ccache --zero-stats
          cmake -G Ninja -S llvm-project/llvm -B obj \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER="clang-$CLANG_VERSION" \
            -DCMAKE_CXX_COMPILER="clang++-$CLANG_VERSION" \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_FLAGS='-stdlib=libc++' \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_PROJECTS='llvm;clang' \
            -DLLVM_EXTERNAL_PROJECTS=eld \
            -DLLVM_EXTERNAL_ELD_SOURCE_DIR="$PWD/llvm-project/eld" \
            -DLLVM_TARGETS_TO_BUILD='ARM;AArch64;RISCV;Hexagon;X86' \
            -DELD_ENABLE_SYMBOL_VERSIONING=ON

      - name: Build ld.eld
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          ninja -C obj ld.eld
          ccache --show-stats
          # ld.eld links eld's own shared libraries (libLW) from the build tree through its RUNPATH.
          # Take every library it resolves there and point both at ./lib, so the tree is relocatable.
          mkdir -p eld-dist/bin eld-dist/lib
          cp -L obj/bin/ld.eld eld-dist/bin/ld.eld
          ldd obj/bin/ld.eld | awk -v t="$PWD/obj/" 'index($3, t) == 1 {print $3}' | xargs -r cp -L -t eld-dist/lib
          patchelf --set-rpath '$ORIGIN/../lib' eld-dist/bin/ld.eld
          for lib in eld-dist/lib/*; do patchelf --set-rpath '$ORIGIN' "$lib"; done
          ls -l eld-dist/lib

      - name: Save ccache
        # also when the build failed or was cancelled: the next run resumes from what compiled
        if: always() && steps.dist.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .ccache
          key: ccache-clang${{ env.CLANG_VERSION }}-${{ github.run_id }}

      - name: Smoke-test ld.eld
        run: |
          eld="$PWD/eld-dist/bin/ld.eld"
          ldd "$eld"
          "$eld" --version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          "$eld" -m aarch64elf --help > /dev/null   # the backend the kernel job links with
          # a real hello-world link through gcc's -B lookup (no LTO plugin: eld cannot load it)
          mkdir smoke && ln -s "$eld" smoke/ld
          printf '#include <stdio.h>\nint main(void){puts("linked by eld");return 0;}\n' > smoke/hello.c
          gcc -Bsmoke/ -fno-use-linker-plugin smoke/hello.c -o smoke/hello
          ./smoke/hello

      - name: Package
        run: |
          printf 'eld %s\nllvm-project %s\nclang-%s\n' \
            "${{ steps.refs.outputs.eld }}" "${{ steps.refs.outputs.llvm }}" "$CLANG_VERSION" > eld-dist/BUILD-INFO
          tar -C eld-dist -czf ld.eld.tar.gz bin lib BUILD-INFO

      - uses: actions/upload-artifact@v4
        with:
          name: ld.eld
          path: ld.eld.tar.gz
          retention-days: 14

  kernel:
    needs: build-eld
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ARCH: arm64
      CROSS_COMPILE: aarch64-linux-gnu-
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - uses: actions/download-artifact@v5
        with:
          name: ld.eld
      - name: Unpack ld.eld
        run: |
          mkdir -p "$RUNNER_TEMP/eld" && tar -C "$RUNNER_TEMP/eld" -xzf ld.eld.tar.gz
          echo "ELD=$RUNNER_TEMP/eld/bin/ld.eld" >> "$GITHUB_ENV"
          cat "$RUNNER_TEMP/eld/BUILD-INFO"

      - name: Install the kernel build and boot tools
        run: |
          sudo apt-get update
          # libc++ runtime: ld.eld is linked against it
          sudo apt-get install -y --no-install-recommends \
            build-essential bc bison flex libssl-dev libelf-dev cpio \
            gcc-aarch64-linux-gnu qemu-system-arm \
            "libc++1-$CLANG_VERSION" "libc++abi1-$CLANG_VERSION"
          "$ELD" --version | head -1

      - run: pip install .

      - name: Fetch the kernel
        run: git clone --depth 1 --branch "$KERNEL_REF" https://github.com/torvalds/linux "$RUNNER_TEMP/linux"

      - name: Port the kernel to eld
        run: eldconv convert "$RUNNER_TEMP/linux" "$RUNNER_TEMP/linux-eld" --eld "$ELD" -v

      - name: Build the kernel with eld and check every link went through it
        # configure.sh: tinyconfig plus what the boot needs. `check` cleans, then builds Image, whose
        # dependencies include vmlinux and the vDSO, and fails if any link bypassed eld or left a
        # malformed image. --compare also builds the unconverted tree with GNU ld and reports how
        # eld's vmlinux and vDSO differ from that build's, layout included (a failure to build it
        # fails the job; without --compare it would only be a warning).
        run: |
          eldconv check "$RUNNER_TEMP/linux-eld" --eld "$ELD" --jobs "$(nproc)" --timeout 7200 \
            --pre-build "$GITHUB_WORKSPACE/ci/kernel/configure.sh" \
            --build-arg ARCH="$ARCH" --build-arg CROSS_COMPILE="$CROSS_COMPILE" --build-arg Image \
            --compare \
            | tee check.txt

      - name: Boot the eld-linked kernel under qemu
        run: ci/kernel/boot.sh "$RUNNER_TEMP/linux-eld/arch/arm64/boot/Image" boot.log

      - name: Collect reports
        if: always()
        run: |
          cp "$RUNNER_TEMP/linux-eld/eldconv-report.md" . 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-eld/build-eld/eldconv-check.json" . 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-eld/build-eld/eldconv-check.md" . 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-eld/build-eld/eldconv-build.log" . 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-eld.reference/build-eld/eldconv-reference-build.log" . 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-eld/.config" kernel.config 2>/dev/null || true
          cp "$RUNNER_TEMP/linux-eld/arch/arm64/boot/Image" . 2>/dev/null || true
          {
            echo "### kernel \`$KERNEL_REF\` on arm64"
            grep -a -m1 '^Linux version' boot.log 2>/dev/null || echo "no boot log"
            cat eldconv-check.md 2>/dev/null || true
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kernel-eld
          path: |
            eldconv-report.md
            eldconv-check.json
            eldconv-check.md
            eldconv-build.log
            eldconv-reference-build.log
            check.txt
            boot.log
            kernel.config
            Image
          if-no-files-found: ignore
          retention-days: 14
