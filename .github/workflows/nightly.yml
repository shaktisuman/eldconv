# Nightly validation against a real ld.eld.
#
# Builds eld `main` against llvm-project `main` (the pairing eld's own CI uses), with
# -DELD_ENABLE_SYMBOL_VERSIONING=ON as docs/USAGE.md recommends, then:
#   - reruns the whole test suite with ELDCONV_TEST_ELD pointing at it,
#   - audits the mapping table against it (`eldconv audit` fails on rules this eld rejects),
#   - compares a fresh `eldconv surface` with the bundled snapshot (drift is a warning),
#   - converts and checks the real projects listed in docs/VALIDATION.md.
# It also reruns ci.yml, so runner-image changes show up even when no code changed.
name: nightly

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
    inputs:
      eld_ref:
        description: qualcomm/eld branch, tag or commit
        default: main
      llvm_ref:
        description: llvm/llvm-project branch, tag or commit
        default: main

permissions:
  contents: read

concurrency:
  group: nightly-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash   # -eo pipefail

env:
  ELD_REF: ${{ inputs.eld_ref || 'main' }}
  LLVM_REF: ${{ inputs.llvm_ref || 'main' }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  build-eld:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      CCACHE_DIR: ${{ github.workspace }}/.ccache
    steps:
      - name: Resolve refs to commits
        id: refs
        run: |
          resolve() {  # repo ref -> commit sha (a peeled annotated tag wins over the tag object)
            if [[ "$2" =~ ^[0-9a-f]{40}$ ]]; then echo "$2"; return; fi
            git ls-remote "https://github.com/$1" "refs/heads/$2" "refs/tags/$2*" |
              awk -v h="refs/heads/$2" -v t="refs/tags/$2" \
                '$2 == t "^{}" {p=$1} $2 == h || $2 == t {r=$1} END {print p ? p : r}'
          }
          eld=$(resolve qualcomm/eld "$ELD_REF")
          llvm=$(resolve llvm/llvm-project "$LLVM_REF")
          test -n "$eld" && test -n "$llvm" || { echo "::error::cannot resolve eld=$ELD_REF llvm=$LLVM_REF"; exit 1; }
          echo "eld=$eld" >> "$GITHUB_OUTPUT"
          echo "llvm=$llvm" >> "$GITHUB_OUTPUT"
          echo "eld \`$eld\` on llvm-project \`$llvm\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Reuse an ld.eld built from the same commits
        id: dist
        uses: actions/cache@v4
        with:
          path: eld-dist
          key: ld.eld-${{ steps.refs.outputs.eld }}-${{ steps.refs.outputs.llvm }}

      - name: Free disk space
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /

      - name: Install build dependencies
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake ninja-build ccache lld python3

      - name: Checkout llvm-project
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: llvm/llvm-project
          ref: ${{ steps.refs.outputs.llvm }}
          path: llvm-project
          fetch-depth: 1

      - name: Checkout eld
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/checkout@v5
        with:
          repository: qualcomm/eld
          ref: ${{ steps.refs.outputs.eld }}
          path: llvm-project/eld
          fetch-depth: 1

      - name: Restore ccache
        if: steps.dist.outputs.cache-hit != 'true'
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-${{ steps.refs.outputs.llvm }}-${{ steps.refs.outputs.eld }}
          restore-keys: ccache-

      - name: Configure
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          ccache --max-size=3G
          ccache --zero-stats
          cmake -G Ninja -S llvm-project/llvm -B obj \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache \
            -DLLVM_USE_LINKER=lld \
            -DLLVM_PARALLEL_LINK_JOBS=2 \
            -DLLVM_ENABLE_ASSERTIONS=OFF \
            -DLLVM_ENABLE_PROJECTS='llvm;clang' \
            -DLLVM_EXTERNAL_PROJECTS=eld \
            -DLLVM_EXTERNAL_ELD_SOURCE_DIR="$PWD/llvm-project/eld" \
            -DLLVM_TARGETS_TO_BUILD='ARM;AArch64;RISCV;Hexagon;X86' \
            -DELD_ENABLE_SYMBOL_VERSIONING=ON

      - name: Build ld.eld
        if: steps.dist.outputs.cache-hit != 'true'
        run: |
          ninja -C obj ld.eld
          ccache --show-stats
          mkdir -p eld-dist/bin
          cp -L obj/bin/ld.eld eld-dist/bin/ld.eld

      - name: Smoke-test ld.eld
        run: |
          eld="$PWD/eld-dist/bin/ld.eld"
          "$eld" --version | head -1 | tee -a "$GITHUB_STEP_SUMMARY"
          # a real hello-world link through gcc's -B lookup (no LTO plugin: eld cannot load it)
          mkdir smoke && ln -s "$eld" smoke/ld
          printf '#include <stdio.h>\nint main(void){puts("linked by eld");return 0;}\n' > smoke/hello.c
          gcc -Bsmoke/ -fno-use-linker-plugin smoke/hello.c -o smoke/hello
          ./smoke/hello

      - name: Package
        run: tar -C eld-dist -czf ld.eld.tar.gz bin

      - uses: actions/upload-artifact@v4
        with:
          name: ld.eld
          path: ld.eld.tar.gz
          retention-days: 7

  real-eld:
    needs: build-eld
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: ld.eld
      - name: Unpack ld.eld
        run: |
          mkdir -p "$RUNNER_TEMP/eld" && tar -C "$RUNNER_TEMP/eld" -xzf ld.eld.tar.gz
          echo "ELD=$RUNNER_TEMP/eld/bin/ld.eld" >> "$GITHUB_ENV"
      - name: Install build systems
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build meson autoconf automake libtool lld
          sudo apt-get install -y --no-install-recommends generate-ninja || echo "::notice::gn not available"
      - run: pip install -e '.[test]'

      - name: Test suite against the real eld
        env:
          ELDCONV_TEST_ELD: ${{ env.ELD }}
        run: pytest -ra

      - name: Audit the mapping table
        if: ${{ !cancelled() }}
        run: eldconv audit --eld "$ELD" -v > audit.json

      - name: Compare the eld surface with the bundled snapshot
        if: ${{ !cancelled() }}
        run: |
          eldconv surface --eld "$ELD" -o surface.json -v
          python - eldconv/data/eld-surface.json surface.json <<'EOF'
          import json, os, sys
          old, new = (json.load(open(p)) for p in sys.argv[1:3])
          lines = []
          if old["eld_version"] != new["eld_version"]:
              lines.append(f"- version: `{old['eld_version']}` -> `{new['eld_version']}`")
          a, b = set(old["targets"]), set(new["targets"])
          lines += [f"- target added: `{t}`" for t in sorted(b - a)]
          lines += [f"- target removed: `{t}`" for t in sorted(a - b)]
          for k, what in (("options", "option"), ("z", "-z keyword")):
              o, n = old[k], new[k]
              for opt in sorted(set(o) | set(n)):
                  if o.get(opt) != n.get(opt):
                      lines.append(f"- {what} `{opt}`: {o.get(opt)} -> {n.get(opt)}")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write("### eld surface vs bundled snapshot\n\n")
              f.write("\n".join(lines) + "\n" if lines else "No difference.\n")
          if lines:
              print(f"::warning::eld surface differs from eldconv/data/eld-surface.json in {len(lines)} place(s); "
                    "regenerate it with `eldconv surface` (see the job summary)")
          print("\n".join(lines) or "no difference")
          EOF

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: audit-and-surface
          path: |
            audit.json
            surface.json
          if-no-files-found: ignore

  projects:
    needs: build-eld
    name: project (${{ matrix.name }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        # pinned so a failure means eld or eldconv changed, not the project
        include:
          - name: lz4
            repo: lz4/lz4
            ref: v1.10.0
          - name: zstd
            repo: facebook/zstd
            ref: v1.5.6
          - name: fmt
            repo: fmtlib/fmt
            ref: 11.0.2
            convert_args: --cmake-arg=-DCMAKE_BUILD_TYPE=Release
            check_args: --cmake-arg=-DCMAKE_BUILD_TYPE=Release
          - name: libuv
            repo: libuv/libuv
            ref: v1.49.2
          - name: zlib-cmake
            repo: madler/zlib
            ref: v1.3.1
            convert_args: --build-system cmake
          - name: zlib-make
            repo: madler/zlib
            ref: v1.3.1
            convert_args: --build-system make
            check_args: --pre-build ./configure
          - name: jq
            repo: jqlang/jq
            ref: jq-1.7.1
            check_args: --build-arg=--disable-docs   # system oniguruma (libonig-dev), not the submodule
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/download-artifact@v5
        with:
          name: ld.eld
      - name: Unpack ld.eld
        run: |
          mkdir -p "$RUNNER_TEMP/eld" && tar -C "$RUNNER_TEMP/eld" -xzf ld.eld.tar.gz
          echo "ELD=$RUNNER_TEMP/eld/bin/ld.eld" >> "$GITHUB_ENV"
      - name: Install build systems
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake ninja-build autoconf automake libtool pkg-config libonig-dev
      - run: pip install .
      - uses: actions/checkout@v5
        with:
          repository: ${{ matrix.repo }}
          ref: ${{ matrix.ref }}
          path: src
          fetch-depth: 1
      - name: Convert
        run: |
          mv src "$RUNNER_TEMP/src"   # DST must be outside SRC, and neither inside this checkout
          eldconv convert "$RUNNER_TEMP/src" "$RUNNER_TEMP/dst" --eld "$ELD" -v ${{ matrix.convert_args }}
      - name: Build with eld and check
        # x86_64 eld emits no copy relocations (docs/VALIDATION.md), so data symbols stay unresolved
        run: |
          eldconv check "$RUNNER_TEMP/dst" --eld "$ELD" --jobs 4 --timeout 2400 \
            --allow-unresolved-data ${{ matrix.check_args }} | tee check.txt
      - name: Collect reports
        if: always()
        run: cp "$RUNNER_TEMP/dst/eldconv-report.md" . 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: report-${{ matrix.name }}
          path: |
            eldconv-report.md
            check.txt
          if-no-files-found: ignore
